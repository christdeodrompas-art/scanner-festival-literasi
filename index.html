<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Kehadiran - Festival Literasi Sulawesi Utara 2026</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      min-height: 300px;
      border: 2px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: #fafafa;
    }

    #status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      background: #f0f0f0;
      text-align: center;
    }

    #hasil {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #f8f9fa;
      border: 1px solid #ddd;
    }

    #hasil h2 {
      margin-top: 0;
    }

    .data {
      margin: 8px 0;
    }

    .data strong {
      display: inline-block;
      width: 150px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .success {
      background: #d1e7dd !important;
      color: #0f5132;
    }

    .error {
      background: #f8d7da !important;
      color: #842029;
    }

    .warning {
      background: #fff3cd !important;
      color: #664d03;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Scanner Kehadiran</h1>

  <div class="subtitle">
    Festival Literasi Sulawesi Utara 2026
  </div>

  <label for="hari">Pilih Hari Kehadiran</label>

  <select id="hari">
    <option value="Hari 2">Hari 2</option>
    <option value="Hari 3">Hari 3</option>
  </select>

  <div id="reader"></div>

  <div id="status">
    Memulai kamera...
  </div>

  <div id="hasil">

    <h2>Data Peserta</h2>

    <div class="data">
      <strong>ID Peserta:</strong>
      <span id="idPeserta"></span>
    </div>

    <div class="data">
      <strong>Nama:</strong>
      <span id="nama"></span>
    </div>

    <div class="data">
      <strong>WhatsApp:</strong>
      <span id="whatsapp"></span>
    </div>

    <div class="data">
      <strong>Kabupaten/Kota:</strong>
      <span id="kabupaten"></span>
    </div>

    <div class="data">
      <strong>Instansi:</strong>
      <span id="instansi"></span>
    </div>

    <button id="btnKonfirmasi" onclick="konfirmasiKehadiran()">
      ✓ KONFIRMASI KEHADIRAN
    </button>

  </div>

</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwCdkbSG5DlSZJmM5N8g7KYU4UHuqXXEpXiP70aSr-9XEX9riRQXBUNVyj2nYqQOSPz/exec";

let scanner = null;
let idPesertaAktif = "";
let sedangMemproses = false;


/* ================================
   CEK LIBRARY
================================ */

window.addEventListener("load", function() {

  if (typeof Html5Qrcode === "undefined") {

    document.getElementById("status").className = "error";

    document.getElementById("status").innerHTML =
      "❌ Library scanner tidak berhasil dimuat.<br><br>" +
      "Periksa koneksi internet kemudian refresh halaman.";

    return;
  }

  mulaiScanner();

});


/* ================================
   MULAI SCANNER
================================ */

function mulaiScanner() {

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: {
      width: 250,
      height: 250
    }
  };

  scanner.start(
    {
      facingMode: "environment"
    },
    config,
    qrBerhasil,
    qrGagal
  )
  .then(function() {

    document.getElementById("status").className = "";

    document.getElementById("status").innerHTML =
      "📷 Kamera aktif. Arahkan kamera ke QR peserta.";

  })
  .catch(function(error) {

    document.getElementById("status").className = "error";

    document.getElementById("status").innerHTML =
      "❌ Kamera tidak dapat digunakan.<br><br>" +
      error;

  });

}


/* ================================
   QR BERHASIL TERBACA
================================ */

function qrBerhasil(decodedText) {

  if (sedangMemproses) {
    return;
  }

  sedangMemproses = true;

  const id = decodedText.trim();

  document.getElementById("status").className = "";

  document.getElementById("status").innerHTML =
    "⏳ Memeriksa data peserta...";

  cariPeserta(id);

}


/* ================================
   QR GAGAL TERBACA
================================ */

function qrGagal(errorMessage) {

  // Tidak perlu menampilkan error
  // karena scanner akan terus mencari QR.
}


/* ================================
   CARI PESERTA
================================ */

function cariPeserta(id) {

  panggilAPI(
    {
      action: "lookup",
      id: id
    },
    function(response) {

      if (!response.success) {

        document.getElementById("status").className = "error";

        document.getElementById("status").innerHTML =
          "❌ Terjadi kesalahan saat menghubungi server.";

        sedangMemproses = false;

        return;
      }

      if (!response.found) {

        document.getElementById("status").className = "error";

        document.getElementById("status").innerHTML =
          "❌ Peserta tidak ditemukan.<br>ID: " + id;

        sedangMemproses = false;

        return;
      }

      idPesertaAktif = response.participant.idPeserta;

      document.getElementById("idPeserta").textContent =
        response.participant.idPeserta;

      document.getElementById("nama").textContent =
        response.participant.nama;

      document.getElementById("whatsapp").textContent =
        response.participant.whatsapp;

      document.getElementById("kabupaten").textContent =
        response.participant.kabupaten;

      document.getElementById("instansi").textContent =
        response.participant.instansi || "-";

      document.getElementById("hasil").style.display = "block";

      document.getElementById("status").className = "success";

      document.getElementById("status").innerHTML =
        "✓ Peserta ditemukan. Silakan konfirmasi kehadiran.";

      sedangMemproses = false;

    }
  );

}


/* ================================
   KONFIRMASI KEHADIRAN
================================ */

function konfirmasiKehadiran() {

  if (!idPesertaAktif) {

    alert("ID peserta belum tersedia.");

    return;
  }

  const hari = document.getElementById("hari").value;

  const tombol = document.getElementById("btnKonfirmasi");

  tombol.disabled = true;

  tombol.textContent = "⏳ Menyimpan...";

  document.getElementById("status").className = "";

  document.getElementById("status").innerHTML =
    "⏳ Mencatat kehadiran...";

  panggilAPI(
    {
      action: "scan",
      id: idPesertaAktif,
      hari: hari
    },
    function(response) {

      tombol.disabled = false;

      tombol.textContent =
        "✓ KONFIRMASI KEHADIRAN";

      if (!response.success) {

        document.getElementById("status").className = "error";

        document.getElementById("status").innerHTML =
          "❌ " + (response.message || "Gagal mencatat kehadiran.");

        return;
      }

      if (response.duplicate) {

        document.getElementById("status").className = "warning";

        document.getElementById("status").innerHTML =
          "⚠️ Peserta sudah tercatat hadir pada " + hari + ".";

        return;
      }

      document.getElementById("status").className = "success";

      document.getElementById("status").innerHTML =
        "✓ KEHADIRAN BERHASIL DICATAT<br>" +
        idPesertaAktif + " — " + hari;

    }
  );

}


/* ================================
   JSONP API
================================ */

function panggilAPI(params, callback) {

  const callbackName =
    "callback_" + Date.now() + "_" +
    Math.floor(Math.random() * 100000);

  params.callback = callbackName;

  const query = Object.keys(params)
    .map(function(key) {

      return encodeURIComponent(key) +
        "=" +
        encodeURIComponent(params[key]);

    })
    .join("&");

  const script = document.createElement("script");

  window[callbackName] = function(data) {

    try {
      callback(data);
    } finally {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }

  };

  script.onerror = function() {

    document.getElementById("status").className = "error";

    document.getElementById("status").innerHTML =
      "❌ Tidak dapat terhubung ke server Apps Script.";

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    sedangMemproses = false;

  };

  script.src = API_URL + "?" + query;

  document.body.appendChild(script);

}

</script>

</body>
</html>
