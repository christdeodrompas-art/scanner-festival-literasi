<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Kehadiran - Festival Literasi Sulawesi Utara 2026</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
    }

    select {
      border: 1px solid #ccc;
      background: white;
      margin-bottom: 12px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: bold;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 15px auto;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
      min-height: 280px;
      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      display: block;
      object-fit: cover;
      border-radius: 14px;
    }

    #reader__scan_region {
      width: 100% !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    #reader__camera_selection {
      display: none !important;
    }

    .scan-info {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }

    .result {
      display: none;
    }

    .result-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .result-row strong {
      display: block;
      margin-bottom: 3px;
    }

    .qr-id {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 Scanner Kehadiran</h1>
    <p>Festival Literasi Sulawesi Utara 2026</p>
  </div>

  <div class="card">

    <label for="hari">Hari Kehadiran</label>

    <select id="hari">
      <option value="Hari 2">Hari 2</option>
      <option value="Hari 3">Hari 3</option>
    </select>

    <button id="btnKamera" onclick="aktifkanKamera()">
      📷 AKTIFKAN KAMERA
    </button>

  </div>

  <div id="status" class="status">
    Kamera belum diaktifkan.
  </div>

  <div class="card">

    <div id="reader"></div>

    <div class="scan-info">
      Arahkan QR peserta ke dalam kotak scanner.
    </div>

  </div>

  <div id="resultCard" class="card result">

    <h3>📋 Hasil Scan</h3>

    <div class="result-row">
      <strong>ID Peserta:</strong>
      <span id="hasilId"></span>
    </div>

    <div class="result-row">
      <strong>Nama:</strong>
      <span id="hasilNama"></span>
    </div>

    <div class="result-row">
      <strong>Kabupaten/Kota:</strong>
      <span id="hasilKabupaten"></span>
    </div>

    <div class="result-row">
      <strong>Instansi:</strong>
      <span id="hasilInstansi"></span>
    </div>

    <br>

    <button id="btnKonfirmasi" onclick="konfirmasiKehadiran()">
      ✅ KONFIRMASI KEHADIRAN
    </button>

    <br><br>

    <button onclick="scanBerikutnya()">
      🔄 SCAN PESERTA BERIKUTNYA
    </button>

  </div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbwCdkbSG5DlSZjM5N8g7KYU4UHuqXXEpXiP70aSr-9XEX9riRQXBUNVyj2nYqQOSPz/exec';

let scanner = null;
let kameraAktif = false;
let sedangMemproses = false;
let idPesertaSaatIni = '';
let timerAPI = null;


/* =========================
   STATUS
========================= */

function setStatus(teks, tipe = '') {

  const el = document.getElementById('status');

  el.textContent = teks;

  el.className = 'status';

  if (tipe) {
    el.classList.add(tipe);
  }
}


/* =========================
   AKTIFKAN KAMERA
========================= */

async function aktifkanKamera() {

  const tombol = document.getElementById('btnKamera');

  if (kameraAktif) {
    setStatus('⚠️ Kamera sudah aktif.', 'success');
    return;
  }

  tombol.disabled = true;
  tombol.textContent = '⏳ MEMBUKA KAMERA...';

  setStatus('⏳ Meminta akses kamera...');

  try {

    /*
      Buat scanner baru
    */

    scanner = new Html5Qrcode('reader');


    /*
      Ambil daftar kamera
    */

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error('Tidak ada kamera yang ditemukan.');
    }


    /*
      Cari kamera belakang
    */

    let kameraBelakang = cameras.find(camera => {

      const nama = (camera.label || '').toLowerCase();

      return (
        nama.includes('back') ||
        nama.includes('rear') ||
        nama.includes('environment') ||
        nama.includes('belakang')
      );

    });


    /*
      Jika tidak ditemukan,
      gunakan kamera terakhir.
    */

    if (!kameraBelakang) {
      kameraBelakang = cameras[cameras.length - 1];
    }


    console.log('Kamera yang digunakan:', kameraBelakang);


    /*
      Konfigurasi scanner
    */

    const config = {

      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        let ukuran = Math.floor(
          Math.min(viewfinderWidth, viewfinderHeight) * 0.70
        );

        ukuran = Math.min(320, ukuran);

        return {
          width: ukuran,
          height: ukuran
        };

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    /*
      START KAMERA

      Penting:
      Status "kamera aktif" baru diberikan
      SETELAH Promise start berhasil.
    */

    await scanner.start(

      kameraBelakang.id,

      config,

      function(decodedText, decodedResult) {

        qrBerhasil(decodedText);

      },

      function(errorMessage) {

        /*
          Error seperti QR belum terbaca
          sengaja tidak ditampilkan.
        */

      }

    );


    /*
      Kalau sampai sini berarti
      scanner.start() benar-benar berhasil.
    */

    kameraAktif = true;

    tombol.disabled = true;

    tombol.textContent = '✅ KAMERA AKTIF';

    setStatus(
      '✅ Kamera aktif. Arahkan QR peserta ke dalam kotak scanner.',
      'success'
    );


  } catch (error) {

    console.error(error);

    kameraAktif = false;

    tombol.disabled = false;

    tombol.textContent = '📷 AKTIFKAN KAMERA';

    setStatus(
      '❌ Kamera gagal dibuka: ' + error.message,
      'error'
    );

    /*
      Bersihkan scanner jika gagal.
    */

    if (scanner) {

      try {
        await scanner.clear();
      } catch (e) {
        console.log(e);
      }

      scanner = null;
    }

  }

}


/* =========================
   QR BERHASIL DIBACA
========================= */

function qrBerhasil(teksQR) {

  if (sedangMemproses) {
    return;
  }

  sedangMemproses = true;

  const id = ambilIdPeserta(teksQR);

  if (!id) {

    sedangMemproses = false;

    setStatus(
      '❌ QR tidak berisi ID peserta yang valid.',
      'error'
    );

    return;
  }


  setStatus(
    '🔎 QR terbaca. Memeriksa data peserta...'
  );


  document.getElementById('resultCard').style.display = 'block';

  document.getElementById('hasilId').textContent = id;

  document.getElementById('hasilNama').textContent = 'Memuat...';

  document.getElementById('hasilKabupaten').textContent = 'Memuat...';

  document.getElementById('hasilInstansi').textContent = 'Memuat...';


  idPesertaSaatIni = id;


  panggilAPI(
    'lookup',
    { id: id },

    function(data) {

      if (!data || !data.success || !data.found) {

        sedangMemproses = false;

        idPesertaSaatIni = '';

        setStatus(
          '❌ Peserta tidak ditemukan.',
          'error'
        );

        document.getElementById('hasilNama').textContent = '-';
        document.getElementById('hasilKabupaten').textContent = '-';
        document.getElementById('hasilInstansi').textContent = '-';

        return;
      }


      document.getElementById('hasilId').textContent =
        data.id || id;

      document.getElementById('hasilNama').textContent =
        data.nama || '-';

      document.getElementById('hasilKabupaten').textContent =
        data.kabupaten || '-';

      document.getElementById('hasilInstansi').textContent =
        data.instansi || '-';


      setStatus(
        '✅ QR TERBACA: ' + (data.id || id),
        'success'
      );


      document.getElementById('btnKonfirmasi').disabled = false;

    }

  );

}


/* =========================
   AMBIL ID DARI QR
========================= */

function ambilIdPeserta(teks) {

  if (!teks) {
    return '';
  }

  teks = String(teks).trim();


  /*
    Jika QR langsung berisi:
    FLS-20260925-1234
  */

  if (/^FLS-/i.test(teks)) {

    return teks;

  }


  /*
    Jika QR berupa URL:
    https://.../?id=FLS-...
  */

  try {

    const url = new URL(teks);

    const id = url.searchParams.get('id');

    if (id && /^FLS-/i.test(id)) {

      return id;

    }

  } catch (e) {

  }


  /*
    Cari pola FLS- di dalam teks
  */

  const cocok = teks.match(
    /FLS-\d{8}-\d+/i
  );

  if (cocok) {

    return cocok[0];

  }


  return '';

}


/* =========================
   KONFIRMASI KEHADIRAN
========================= */

function konfirmasiKehadiran() {

  if (!idPesertaSaatIni) {

    setStatus(
      '❌ ID peserta belum tersedia.',
      'error'
    );

    return;
  }


  const hari =
    document.getElementById('hari').value;


  const tombol =
    document.getElementById('btnKonfirmasi');


  tombol.disabled = true;

  tombol.textContent = '⏳ MENYIMPAN...';


  setStatus(
    '⏳ Menyimpan kehadiran...'
  );


  panggilAPI(

    'scan',

    {
      id: idPesertaSaatIni,
      hari: hari
    },

    function(data) {

      tombol.disabled = false;

      tombol.textContent =
        '✅ KONFIRMASI KEHADIRAN';


      if (!data) {

        setStatus(
          '❌ Tidak ada respons dari server.',
          'error'
        );

        return;
      }


      if (data.success) {

        setStatus(
          '✅ KEHADIRAN BERHASIL DICATAT - ' + hari,
          'success'
        );

        return;
      }


      /*
        Jika peserta sudah absen
      */

      if (
        data.duplicate ||
        data.already ||
        data.message &&
        data.message.toLowerCase().includes('sudah')
      ) {

        setStatus(
          '⚠️ Peserta sudah tercatat untuk ' + hari + '.',
          'error'
        );

        return;
      }


      setStatus(
        '❌ ' + (data.message || 'Gagal mencatat kehadiran.'),
        'error'
      );

    }

  );

}


/* =========================
   SCAN PESERTA BERIKUTNYA
========================= */

function scanBerikutnya() {

  sedangMemproses = false;

  idPesertaSaatIni = '';

  document.getElementById('resultCard').style.display = 'none';

  document.getElementById('hasilId').textContent = '';
  document.getElementById('hasilNama').textContent = '';
  document.getElementById('hasilKabupaten').textContent = '';
  document.getElementById('hasilInstansi').textContent = '';

  document.getElementById('btnKonfirmasi').disabled = false;

  setStatus(
    '📷 Siap scan peserta berikutnya.',
    'success'
  );

}


/* =========================
   PANGGIL APPS SCRIPT
   JSONP
========================= */

function panggilAPI(action, params, callback) {

  const callbackName =
    'callback_' + Date.now() + '_' +
    Math.floor(Math.random() * 100000);


  const script =
    document.createElement('script');


  const query = new URLSearchParams();

  query.set('action', action);

  query.set('callback', callbackName);


  Object.keys(params || {}).forEach(function(key) {

    query.set(
      key,
      params[key]
    );

  });


  const url =
    API_URL + '?' + query.toString();


  window[callbackName] = function(data) {

    clearTimeout(timerAPI);

    try {
      callback(data);
    } finally {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }

  };


  script.onerror = function() {

    clearTimeout(timerAPI);

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    setStatus(
      '❌ Gagal terhubung ke server Apps Script.',
      'error'
    );

    sedangMemproses = false;

  };


  document.body.appendChild(script);


  timerAPI = setTimeout(function() {

    if (window[callbackName]) {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      setStatus(
        '❌ Server terlalu lama merespons.',
        'error'
      );

      sedangMemproses = false;

    }

  }, 15000);

}

</script>

</body>
</html>
