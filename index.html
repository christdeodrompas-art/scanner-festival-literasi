<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Festival Literasi Sulawesi Utara 2026</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #0b57d0;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 15px 40px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    select {
      border: 1px solid #ccc;
      background: white;
      margin-bottom: 12px;
    }

    button {
      border: none;
      background: #0b57d0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #cameraContainer {
      width: 100%;
      min-height: 350px;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #reader {
      width: 100%;
      min-height: 350px;
      background: #111;
      position: relative;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      min-height: 350px;
      object-fit: cover !important;
      display: block !important;
      background: #111;
    }

    #reader img {
      display: none !important;
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      background: #111;
      z-index: 5;
      text-align: center;
      padding: 20px;
    }

    #placeholder .camera-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    #placeholder p {
      margin: 5px 0;
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scan-box {
      width: 65%;
      max-width: 300px;
      aspect-ratio: 1 / 1;
      border: 4px solid #00ff66;
      border-radius: 15px;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.35),
        0 0 15px rgba(0,255,102,0.8);
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 9px;
      background: #eef2f5;
      font-size: 14px;
      text-align: center;
    }

    .status.success {
      background: #dff6e5;
      color: #146c2e;
    }

    .status.error {
      background: #ffe1e1;
      color: #a30000;
    }

    .status.warning {
      background: #fff3cd;
      color: #856404;
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
    }

    .participant-info {
      background: #f7f9fb;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .participant-info div {
      margin-bottom: 8px;
    }

    .participant-info div:last-child {
      margin-bottom: 0;
    }

    .participant-info strong {
      display: inline-block;
      min-width: 125px;
    }

    .success-box {
      background: #dff6e5;
      color: #146c2e;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .duplicate-box {
      background: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .camera-select {
      display: none;
    }

    .camera-select.show {
      display: block;
    }

    .camera-info {
      font-size: 13px;
      color: #666;
      margin: 8px 0 12px;
      text-align: center;
    }

    .small {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 500px) {

      .container {
        margin-top: 10px;
      }

      .card {
        padding: 15px;
      }

      #cameraContainer,
      #reader {
        min-height: 300px;
      }

      #reader video {
        min-height: 300px;
      }

      .scan-box {
        width: 70%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Festival Literasi Sulawesi Utara 2026</h1>
    <p>Scanner Kehadiran Peserta</p>
  </div>


  <div class="container">

    <!-- PILIH HARI -->
    <div class="card">

      <label for="hari">
        Pilih Hari Kehadiran
      </label>

      <select id="hari">
        <option value="Hari 2">Hari 2</option>
        <option value="Hari 3">Hari 3</option>
      </select>


      <!-- PILIH KAMERA -->
      <div id="cameraSelectContainer" class="camera-select">

        <label for="cameraSelect">
          Pilih Kamera
        </label>

        <select id="cameraSelect" onchange="gantiKamera()">
        </select>

        <div id="cameraInfo" class="camera-info">
          Kamera tersedia akan muncul di sini.
        </div>

      </div>


      <button id="btnKamera" onclick="aktifkanKamera()">
        📷 AKTIFKAN KAMERA
      </button>


      <div id="status" class="status">
        Kamera belum diaktifkan.
      </div>

    </div>


    <!-- CAMERA -->
    <div class="card">

      <div id="cameraContainer">

        <div id="reader"></div>

        <div id="placeholder">

          <div class="camera-icon">
            📷
          </div>

          <p>
            <strong>Kamera belum aktif</strong>
          </p>

          <p>
            Tekan tombol "AKTIFKAN KAMERA"
          </p>

        </div>


        <div class="scan-overlay">
          <div class="scan-box"></div>
        </div>

      </div>


      <div class="small">
        Arahkan QR peserta ke dalam kotak hijau.
      </div>

    </div>


    <!-- DATA PESERTA -->
    <div id="resultCard" class="card result">

      <h3 style="margin-top:0;">
        Data Peserta
      </h3>

      <div id="hasilScan"></div>

      <button
        id="btnKonfirmasi"
        onclick="konfirmasiKehadiran()">

        ✅ KONFIRMASI KEHADIRAN

      </button>


      <button
        onclick="scanLagi()"
        style="margin-top:10px;background:#555;">

        🔄 SCAN LAGI

      </button>

    </div>


    <!-- HASIL KEHADIRAN -->
    <div id="successCard" class="card result">

      <div id="hasilKehadiran"></div>

      <button onclick="scanLagi()">

        🔄 SCAN PESERTA BERIKUTNYA

      </button>

    </div>

  </div>


<script>

  /* =====================================================
     APPS SCRIPT API
  ===================================================== */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbwCdkbSG5DlSZJmM5N8g7KYU4UHuqXXEpXiP70aSr-9XEX9riRQXBUNVyj2nYqQOSPz/exec';


  /* =====================================================
     VARIABEL
  ===================================================== */

  let scanner = null;

  let kameraAktif = false;

  let sedangMemproses = false;

  let pesertaTerpilih = null;

  let daftarKamera = [];

  let kameraSekarang = null;


  /* =====================================================
     AKTIFKAN KAMERA
  ===================================================== */

  async function aktifkanKamera() {

    const btn =
      document.getElementById('btnKamera');

    const status =
      document.getElementById('status');

    const placeholder =
      document.getElementById('placeholder');


    if (kameraAktif) {

      status.className =
        'status success';

      status.textContent =
        '✅ Kamera sudah aktif. Arahkan QR ke kotak hijau.';

      return;

    }


    btn.disabled = true;

    btn.textContent =
      '⏳ MEMBUKA KAMERA...';


    status.className =
      'status warning';

    status.textContent =
      '⏳ Meminta akses kamera...';


    try {

      /*
       * LANGKAH PERTAMA
       *
       * Kita meminta akses kamera TANPA
       * menentukan kamera depan/belakang.
       *
       * Ini penting supaya tidak terjadi
       * OverconstrainedError.
       */

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });


      /*
       * Setelah izin kamera diberikan,
       * matikan stream sementara.
       *
       * html5-qrcode akan membuka kamera
       * yang sebenarnya untuk scanner.
       */

      stream.getTracks().forEach(function(track) {
        track.stop();
      });


      status.textContent =
        '⏳ Mendeteksi kamera yang tersedia...';


      /*
       * Ambil semua kamera.
       */

      daftarKamera =
        await Html5Qrcode.getCameras();


      if (!daftarKamera || daftarKamera.length === 0) {

        throw new Error(
          'Tidak ada kamera yang terdeteksi pada perangkat.'
        );

      }


      /*
       * Tampilkan pilihan kamera jika lebih
       * dari satu.
       */

      tampilkanDaftarKamera();


      /*
       * Pilih kamera pertama sebagai default.
       */

      kameraSekarang =
        daftarKamera[0].id;


      /*
       * Kalau ada kamera dengan nama
       * "back", "rear", atau "environment",
       * kita pilih kamera tersebut sebagai
       * default TANPA memaksanya.
       */

      const kameraBelakang =
        daftarKamera.find(function(camera) {

          const nama =
            String(camera.label || '').toLowerCase();

          return (
            nama.includes('back') ||
            nama.includes('rear') ||
            nama.includes('environment') ||
            nama.includes('belakang')
          );

        });


      if (kameraBelakang) {

        kameraSekarang =
          kameraBelakang.id;

      }


      /*
       * Set pilihan kamera pada dropdown.
       */

      const cameraSelect =
        document.getElementById('cameraSelect');

      cameraSelect.value =
        kameraSekarang;


      /*
       * Mulai scanner.
       */

      await mulaiScannerDenganKamera(
        kameraSekarang
      );


    } catch (error) {

      console.error(error);


      kameraAktif = false;


      btn.disabled = false;

      btn.textContent =
        '📷 AKTIFKAN KAMERA';


      status.className =
        'status error';


      let pesan =
        error && error.message
          ? error.message
          : String(error);


      if (
        error &&
        error.name === 'NotAllowedError'
      ) {

        pesan =
          'Izin kamera ditolak oleh browser.';

      }


      if (
        error &&
        error.name === 'NotFoundError'
      ) {

        pesan =
          'Kamera tidak ditemukan pada perangkat.';

      }


      if (
        error &&
        error.name === 'NotReadableError'
      ) {

        pesan =
          'Kamera sedang digunakan oleh aplikasi lain.';

      }


      status.textContent =
        '❌ Kamera gagal dibuka: ' + pesan;

    }

  }


  /* =====================================================
     TAMPILKAN DAFTAR KAMERA
  ===================================================== */

  function tampilkanDaftarKamera() {

    const container =
      document.getElementById(
        'cameraSelectContainer'
      );


    const select =
      document.getElementById(
        'cameraSelect'
      );


    const info =
      document.getElementById(
        'cameraInfo'
      );


    select.innerHTML = '';


    daftarKamera.forEach(function(camera, index) {

      const option =
        document.createElement('option');


      option.value =
        camera.id;


      let nama =
        camera.label;


      if (!nama || nama.trim() === '') {

        nama =
          'Kamera ' + (index + 1);

      }


      option.textContent =
        nama;


      select.appendChild(option);

    });


    select.value =
      kameraSekarang;


    container.classList.add('show');


    info.textContent =
      daftarKamera.length +
      ' kamera terdeteksi pada perangkat.';

  }


  /* =====================================================
     MULAI SCANNER DENGAN CAMERA ID
  ===================================================== */

  async function mulaiScannerDenganKamera(
    cameraId
  ) {

    const btn =
      document.getElementById('btnKamera');

    const status =
      document.getElementById('status');

    const placeholder =
      document.getElementById('placeholder');


    /*
     * Kalau scanner lama masih ada,
     * hentikan terlebih dahulu.
     */

    if (scanner) {

      try {
        await scanner.stop();
      } catch (e) {}

      try {
        await scanner.clear();
      } catch (e) {}

      scanner = null;

    }


    scanner =
      new Html5Qrcode('reader');


    /*
     * Konfigurasi QR.
     */

    const config = {

      fps: 10,

      qrbox: function(width, height) {

        const ukuran =
          Math.floor(
            Math.min(width, height) * 0.65
          );


        return {

          width:
            Math.min(300, ukuran),

          height:
            Math.min(300, ukuran)

        };

      },


      disableFlip: false,


      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]

    };


    status.className =
      'status warning';

    status.textContent =
      '⏳ Membuka kamera...';


    /*
     * PENTING:
     *
     * Kita menggunakan CAMERA ID.
     *
     * Tidak menggunakan:
     * environment
     * exact
     * ideal
     *
     * sehingga lebih kompatibel
     * dengan berbagai perangkat.
     */

    await scanner.start(

      cameraId,

      config,


      function(decodedText, decodedResult) {

        qrBerhasil(decodedText);

      },


      function(errorMessage) {

        /*
         * Error scanning normal diabaikan.
         * Kamera tetap berjalan.
         */

      }

    );


    kameraAktif = true;


    placeholder.classList.add(
      'hidden'
    );


    btn.disabled = false;

    btn.textContent =
      '📷 KAMERA AKTIF';


    status.className =
      'status success';

    status.textContent =
      '✅ Kamera aktif. Arahkan QR peserta ke kotak hijau.';


    pastikanVideoTerlihat();

  }


  /* =====================================================
     GANTI KAMERA
  ===================================================== */

  async function gantiKamera() {

    const select =
      document.getElementById(
        'cameraSelect'
      );


    const cameraId =
      select.value;


    if (!cameraId) {
      return;
    }


    kameraSekarang =
      cameraId;


    const status =
      document.getElementById(
        'status'
      );


    try {

      status.className =
        'status warning';

      status.textContent =
        '⏳ Mengganti kamera...';


      await mulaiScannerDenganKamera(
        cameraId
      );


      status.className =
        'status success';

      status.textContent =
        '✅ Kamera berhasil diganti.';

    } catch (error) {

      console.error(error);


      kameraAktif = false;


      status.className =
        'status error';

      status.textContent =
        '❌ Gagal mengganti kamera: ' +
        (
          error.message ||
          error
        );

    }

  }


  /* =====================================================
     PASTIKAN VIDEO TERLIHAT
  ===================================================== */

  function pastikanVideoTerlihat() {

    setTimeout(function() {

      const video =
        document.querySelector(
          '#reader video'
        );


      if (video) {

        video.style.display =
          'block';

        video.style.width =
          '100%';

        video.style.height =
          'auto';

        video.style.minHeight =
          '300px';

        video.style.objectFit =
          'cover';


        try {

          if (video.paused) {
            video.play();
          }

        } catch (e) {}

      }

    }, 800);

  }


  /* =====================================================
     QR BERHASIL TERBACA
  ===================================================== */

  function qrBerhasil(decodedText) {

    if (sedangMemproses) {
      return;
    }


    sedangMemproses = true;


    const idPeserta =
      String(decodedText || '').trim();


    if (!idPeserta) {

      sedangMemproses = false;

      return;

    }


    const status =
      document.getElementById(
        'status'
      );


    status.className =
      'status warning';


    status.textContent =
      '⏳ QR terbaca: ' +
      idPeserta +
      '. Mencari data peserta...';


    cariPeserta(idPeserta);

  }


  /* =====================================================
     CARI PESERTA
  ===================================================== */

  function cariPeserta(idPeserta) {

    const callbackName =
      'lookupCallback_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 10000
      );


    const script =
      document.createElement(
        'script'
      );


    window[callbackName] =
      function(data) {

        try {

          if (!data || !data.success) {

            tampilkanError(
              data && data.message
                ? data.message
                : 'Data peserta tidak ditemukan.'
            );

            return;

          }


          if (!data.found) {

            tampilkanError(
              'ID peserta tidak ditemukan: ' +
              idPeserta
            );

            return;

          }


          pesertaTerpilih =
            data;


          tampilkanPeserta(data);


        } finally {

          delete window[callbackName];


          if (script.parentNode) {

            script.parentNode
              .removeChild(script);

          }

        }

      };


    script.onerror =
      function() {

        tampilkanError(
          'Tidak dapat terhubung ke server.'
        );


        delete window[callbackName];


        if (script.parentNode) {

          script.parentNode
            .removeChild(script);

        }

      };


    script.src =
      API_URL +
      '?action=lookup' +
      '&id=' +
      encodeURIComponent(
        idPeserta
      ) +
      '&callback=' +
      encodeURIComponent(
        callbackName
      );


    document.body.appendChild(
      script
    );

  }


  /* =====================================================
     TAMPILKAN PESERTA
  ===================================================== */

  function tampilkanPeserta(data) {

    const resultCard =
      document.getElementById(
        'resultCard'
      );


    const hasil =
      document.getElementById(
        'hasilScan'
      );


    const status =
      document.getElementById(
        'status'
      );


    hasil.innerHTML =

      '<div class="participant-info">' +

      '<div>' +
      '<strong>ID Peserta</strong>: ' +
      escapeHtml(
        data.idPeserta || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>Nama</strong>: ' +
      escapeHtml(
        data.nama || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>Kabupaten/Kota</strong>: ' +
      escapeHtml(
        data.kabupaten || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>Instansi</strong>: ' +
      escapeHtml(
        data.instansi || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>Jenis Peserta</strong>: ' +
      escapeHtml(
        data.jenisPeserta || ''
      ) +
      '</div>' +

      '</div>';


    resultCard.classList.add(
      'show'
    );


    status.className =
      'status success';


    status.textContent =
      '✅ QR TERBACA: ' +
      (
        data.idPeserta || ''
      );


    sedangMemproses = false;

  }


  /* =====================================================
     KONFIRMASI KEHADIRAN
  ===================================================== */

  function konfirmasiKehadiran() {

    if (!pesertaTerpilih) {

      tampilkanError(
        'Data peserta belum tersedia.'
      );

      return;

    }


    const hari =
      document.getElementById(
        'hari'
      ).value;


    const btn =
      document.getElementById(
        'btnKonfirmasi'
      );


    btn.disabled = true;

    btn.textContent =
      '⏳ MENYIMPAN KEHADIRAN...';


    const status =
      document.getElementById(
        'status'
      );


    status.className =
      'status warning';


    status.textContent =
      '⏳ Menyimpan kehadiran...';


    const callbackName =
      'scanCallback_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 10000
      );


    const script =
      document.createElement(
        'script'
      );


    window[callbackName] =
      function(data) {

        try {

          if (!data) {

            tampilkanError(
              'Respons server kosong.'
            );

            return;

          }


          if (data.success) {

            tampilkanBerhasil(
              data
            );

          } else {

            if (
              data.duplicate ||
              data.status === 'SUDAH HADIR'
            ) {

              tampilkanDuplikat(
                data
              );

            } else {

              tampilkanError(
                data.message ||
                'Kehadiran gagal disimpan.'
              );

            }

          }

        } finally {

          delete window[callbackName];


          if (script.parentNode) {

            script.parentNode
              .removeChild(script);

          }


          btn.disabled = false;


          btn.textContent =
            '✅ KONFIRMASI KEHADIRAN';

        }

      };


    script.onerror =
      function() {

        tampilkanError(
          'Tidak dapat menghubungi server.'
        );


        delete window[callbackName];


        if (script.parentNode) {

          script.parentNode
            .removeChild(script);

        }


        btn.disabled = false;


        btn.textContent =
          '✅ KONFIRMASI KEHADIRAN';

      };


    script.src =
      API_URL +
      '?action=scan' +
      '&id=' +
      encodeURIComponent(
        pesertaTerpilih.idPeserta
      ) +
      '&hari=' +
      encodeURIComponent(
        hari
      ) +
      '&callback=' +
      encodeURIComponent(
        callbackName
      );


    document.body.appendChild(
      script
    );

  }


  /* =====================================================
     BERHASIL
  ===================================================== */

  function tampilkanBerhasil(data) {

    document
      .getElementById(
        'resultCard'
      )
      .classList.remove(
        'show'
      );


    const successCard =
      document.getElementById(
        'successCard'
      );


    const hasil =
      document.getElementById(
        'hasilKehadiran'
      );


    hasil.innerHTML =

      '<div class="success-box">' +
      '✅ KEHADIRAN BERHASIL DICATAT' +
      '</div>' +

      '<div class="participant-info">' +

      '<div>' +
      '<strong>Nama</strong>: ' +
      escapeHtml(
        pesertaTerpilih.nama || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>ID Peserta</strong>: ' +
      escapeHtml(
        pesertaTerpilih.idPeserta || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>Hari</strong>: ' +
      escapeHtml(
        document.getElementById(
          'hari'
        ).value
      ) +
      '</div>' +

      '</div>';


    successCard.classList.add(
      'show'
    );


    const status =
      document.getElementById(
        'status'
      );


    status.className =
      'status success';


    status.textContent =
      '✅ Kehadiran berhasil dicatat.';


    pesertaTerpilih = null;

  }


  /* =====================================================
     DUPLIKAT
  ===================================================== */

  function tampilkanDuplikat(data) {

    document
      .getElementById(
        'resultCard'
      )
      .classList.remove(
        'show'
      );


    const successCard =
      document.getElementById(
        'successCard'
      );


    const hasil =
      document.getElementById(
        'hasilKehadiran'
      );


    hasil.innerHTML =

      '<div class="duplicate-box">' +

      '⚠️ PESERTA SUDAH HADIR PADA HARI INI' +

      '</div>' +

      '<div class="participant-info">' +

      '<div>' +
      '<strong>Nama</strong>: ' +
      escapeHtml(
        pesertaTerpilih.nama || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>ID Peserta</strong>: ' +
      escapeHtml(
        pesertaTerpilih.idPeserta || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>Hari</strong>: ' +
      escapeHtml(
        document.getElementById(
          'hari'
        ).value
      ) +
      '</div>' +

      '</div>';


    successCard.classList.add(
      'show'
    );


    const status =
      document.getElementById(
        'status'
      );


    status.className =
      'status warning';


    status.textContent =

  }


  /* =====================================================
     ERROR
  ===================================================== */

  function tampilkanError(message) {

    document
      .getElementById(
        'resultCard'
      )
      .classList.remove(
        'show'
      );


    document
      .getElementById(
        'successCard'
      )
      .classList.remove(
        'show'
      );


    const status =
      document.getElementById(
        'status'
      );


    status.className =
      'status error';


    status.textContent =
      '❌ ' + message;


    sedangMemproses = false;

  }


  /* =====================================================
     SCAN LAGI
  ===================================================== */

  function scanLagi() {

    pesertaTerpilih = null;

    sedangMemproses = false;


    document
      .getElementById(
        'resultCard'
      )
      .classList.remove(
        'show'
      );


    document
      .getElementById(
        'successCard'
      )
      .classList.remove(
        'show'
      );


    const status =
      document.getElementById(
        'status'
      );


    if (kameraAktif) {

      status.className =
        'status success';


      status.textContent =
        '✅ Kamera aktif. Arahkan QR berikutnya.';

    }

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(value) {

    return String(
      value || ''
    )

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

  }


  /* =====================================================
     HALAMAN DIBUKA
  ===================================================== */

  window.addEventListener(
    'load',
    function() {

      const status =
        document.getElementById(
          'status'
        );


      status.className =
        'status';


      status.textContent =
        'Kamera belum diaktifkan. Tekan tombol untuk memulai.';

    }
  );

</script>
