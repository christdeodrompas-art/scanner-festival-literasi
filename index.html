<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Scanner Kehadiran - Festival Literasi Sulawesi Utara 2026</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.header {
  background: white;
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.header h1 {
  margin: 0 0 8px;
  font-size: 23px;
}

.header p {
  margin: 0;
  color: #666;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

select,
button {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  font-size: 16px;
}

select {
  border: 1px solid #ccc;
  margin-bottom: 12px;
}

button {
  border: none;
  background: #111827;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

button:disabled {
  opacity: .6;
}

button.secondary {
  background: #6b7280;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 12px;
}

.status {
  padding: 13px;
  border-radius: 10px;
  margin-top: 12px;
  line-height: 1.5;
}

.success {
  background: #e8f7ed;
  color: #176b35;
}

.error {
  background: #fdecec;
  color: #a52222;
}

.warning {
  background: #fff6df;
  color: #805f00;
}

.result {
  display: none;
}

.decoded {
  word-break: break-all;
  background: #f1f1f1;
  padding: 10px;
  border-radius: 8px;
  font-family: monospace;
  margin-top: 10px;
}

.info {
  background: #f8f9fa;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.info p {
  margin: 8px 0;
}

</style>

</head>

<body>

<div class="container">


<!-- =================================================
     HEADER
================================================= -->

<div class="header">

<h1>
📷 Scanner Kehadiran
</h1>

<p>
Festival Literasi Sulawesi Utara 2026
</p>

</div>


<!-- =================================================
     PILIH HARI + KAMERA
================================================= -->

<div class="card">

<label>
Hari Kehadiran
</label>

<select id="hari">

<option value="Hari 2">
Hari 2
</option>

<option value="Hari 3">
Hari 3
</option>

</select>


<button
  id="btnKamera"
  onclick="mulaiKamera()"
>
📷 AKTIFKAN KAMERA
</button>


<div
  id="status"
  class="status"
>
Kamera belum diaktifkan.
</div>


<div id="reader"></div>

</div>


<!-- =================================================
     HASIL SCAN
================================================= -->

<div
  id="hasilCard"
  class="card result"
>

<h3>
Hasil Scan
</h3>


<div
  id="decoded"
  class="decoded"
></div>


<div
  id="dataPeserta"
  class="info"
>

<p>
<b>ID Peserta:</b>
<span id="idPeserta"></span>
</p>

<p>
<b>Nama:</b>
<span id="namaPeserta"></span>
</p>

<p>
<b>Kabupaten/Kota:</b>
<span id="kabupatenPeserta"></span>
</p>

<p>
<b>Instansi:</b>
<span id="instansiPeserta"></span>
</p>

</div>


<button
  id="btnKonfirmasi"
  onclick="konfirmasiKehadiran()"
>
✅ KONFIRMASI KEHADIRAN
</button>


<button
  class="secondary"
  onclick="scanBerikutnya()"
>
🔄 SCAN PESERTA BERIKUTNYA
</button>

</div>

</div>


<script>


/* =====================================================
   URL APPS SCRIPT
===================================================== */

/*
 * URL WEB APP APPS SCRIPT
 * SUDAH DIISI
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwCdkbSG5DlSZJmM5N8g7KYU4UHuqXXEpXiP70aSr-9XEX9riRQXBUNVyj2nYqQOSPz/exec';


/* =====================================================
   VARIABEL
===================================================== */

let scanner = null;

let kameraAktif = false;

let sedangMemproses = false;

let idPesertaSaatIni = '';


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  pesan,
  tipe = ''
) {

  const el =
    document.getElementById(
      'status'
    );


  el.className =
    'status';


  if (tipe) {

    el.classList.add(
      tipe
    );

  }


  el.innerHTML =
    pesan;

}


/* =====================================================
   MULAI KAMERA
===================================================== */

async function mulaiKamera() {

  if (kameraAktif) {

    setStatus(
      '✅ Kamera sudah aktif.<br>Arahkan QR ke kotak scanner.',
      'success'
    );

    return;

  }


  const tombol =
    document.getElementById(
      'btnKamera'
    );


  tombol.disabled = true;

  tombol.textContent =
    '⏳ MEMBUKA KAMERA...';


  setStatus(
    'Meminta izin kamera...'
  );


  try {

    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      throw new Error(
        'Library QR Scanner tidak berhasil dimuat.'
      );

    }


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    /*
     * Cari kamera belakang.
     */

    let kameraDipilih =
      cameras.find(
        function(camera) {

          const label =
            (
              camera.label ||
              ''
            ).toLowerCase();


          return (

            label.includes('back') ||

            label.includes('rear') ||

            label.includes('environment') ||

            label.includes('belakang')

          );

        }
      );


    /*
     * Jika kamera belakang
     * tidak ditemukan, gunakan
     * kamera terakhir.
     */

    if (!kameraDipilih) {

      kameraDipilih =
        cameras[
          cameras.length - 1
        ];

    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    const config = {

      fps: 12,

      qrbox:
        function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );


          return {

            width:
              Math.min(
                size,
                320
              ),

            height:
              Math.min(
                size,
                320
              )

          };

        },

      aspectRatio: 1.0,

      disableFlip: false

    };


    await scanner.start(

      kameraDipilih.id,

      config,

      qrBerhasil,

      function(errorMessage) {

        /*
         * Tidak ditampilkan.
         * Pesan ini normal saat
         * scanner mencari QR.
         */

      }

    );


    kameraAktif = true;


    tombol.disabled = false;

    tombol.textContent =
      '📷 KAMERA AKTIF';


    setStatus(
      '✅ Kamera aktif.<br>' +
      'Arahkan QR peserta ke dalam kotak scanner.',
      'success'
    );

  }

  catch (error) {

    console.error(error);


    tombol.disabled = false;

    tombol.textContent =
      '📷 COBA AKTIFKAN KAMERA LAGI';


    setStatus(
      '❌ Kamera gagal dibuka.<br><br>' +
      escapeHtml(
        error.message ||
        error
      ),
      'error'
    );

  }

}


/* =====================================================
   QR BERHASIL TERBACA
===================================================== */

function qrBerhasil(
  decodedText
) {

  if (sedangMemproses) {

    return;

  }


  sedangMemproses = true;


  console.log(
    'QR TERBACA:',
    decodedText
  );


  const id =
    normalisasiIdQR(
      decodedText
    );


  document
    .getElementById(
      'hasilCard'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'decoded'
    )
    .innerHTML =
      '<b>QR TERBACA:</b><br>' +
      escapeHtml(
        decodedText
      );


  if (!id) {

    setStatus(
      '❌ Isi QR tidak valid.',
      'error'
    );

    sedangMemproses = false;

    return;

  }


  idPesertaSaatIni =
    id;


  setStatus(
    '🔎 QR berhasil dibaca.<br>' +
    'Mencari data peserta...',
    'warning'
  );


  cariPeserta(
    id
  );

}


/* =====================================================
   NORMALISASI ID QR
===================================================== */

function normalisasiIdQR(
  teks
) {

  if (!teks) {

    return '';

  }


  teks =
    String(teks)
      .trim();


  /*
   * QR utama:
   *
   * FLS-20260925-7169
   */

  if (
    /^FLS-[0-9]{8}-[A-Za-z0-9]+$/i
      .test(teks)
  ) {

    return teks;

  }


  /*
   * Jika QR berisi URL,
   * sistem mencoba mengambil
   * parameter ?id=
   */

  try {

    if (
      teks.startsWith(
        'http://'
      ) ||
      teks.startsWith(
        'https://'
      )
    ) {

      const url =
        new URL(
          teks
        );


      const parameter =
        url.searchParams.get(
          'id'
        );


      if (parameter) {

        return parameter.trim();

      }


      const bagian =
        url.pathname
          .split('/')
          .filter(
            Boolean
          );


      if (
        bagian.length > 0
      ) {

        return bagian[
          bagian.length - 1
        ].trim();

      }

    }

  }

  catch (error) {

    console.log(error);

  }


  return teks;

}


/* =====================================================
   CARI PESERTA
===================================================== */

function cariPeserta(
  id
) {

  panggilAPI(

    'lookup',

    {
      id: id
    },

    function(data) {

      if (
        !data ||
        !data.success
      ) {

        setStatus(
          '❌ Server memberikan respons tidak valid.',
          'error'
        );

        sedangMemproses = false;

        return;

      }


      if (!data.found) {

        setStatus(
          '❌ ID peserta tidak ditemukan.',
          'error'
        );

        sedangMemproses = false;

        return;

      }


      const p =
        data.participant;


      document
        .getElementById(
          'idPeserta'
        )
        .textContent =
          p.idPeserta || id;


      document
        .getElementById(
          'namaPeserta'
        )
        .textContent =
          p.nama || '-';


      document
        .getElementById(
          'kabupatenPeserta'
        )
        .textContent =
          p.kabupaten || '-';


      document
        .getElementById(
          'instansiPeserta'
        )
        .textContent =
          p.instansi || '-';


      document
        .getElementById(
          'btnKonfirmasi'
        )
        .disabled = false;


      setStatus(
        '✅ PESERTA DITEMUKAN.<br>' +
        'Periksa data peserta lalu tekan ' +
        '<b>KONFIRMASI KEHADIRAN</b>.',
        'success'
      );

    }

  );

}


/* =====================================================
   KONFIRMASI KEHADIRAN
===================================================== */

function konfirmasiKehadiran() {

  if (
    !idPesertaSaatIni
  ) {

    setStatus(
      '❌ ID peserta belum tersedia.',
      'error'
    );

    return;

  }


  const hari =
    document
      .getElementById(
        'hari'
      )
      .value;


  const tombol =
    document.getElementById(
      'btnKonfirmasi'
    );


  tombol.disabled = true;

  tombol.textContent =
    '⏳ MENYIMPAN...';


  setStatus(
    '⏳ Menyimpan kehadiran...',
    'warning'
  );


  panggilAPI(

    'scan',

    {

      id:
        idPesertaSaatIni,

      hari:
        hari

    },

    function(data) {

      tombol.disabled = false;

      tombol.textContent =
        '✅ KONFIRMASI KEHADIRAN';


      if (
        !data ||
        !data.success
      ) {

        setStatus(
          '❌ ' +
          (
            data &&
            data.message
              ? data.message
              : 'Terjadi kesalahan pada server.'
          ),
          'error'
        );

        return;

      }


      /*
       * DUPLIKAT
       */

      if (
        data.duplicate
      ) {

        setStatus(
          '⚠️ PESERTA SUDAH TERCATAT HADIR.<br><br>' +
          escapeHtml(
            data.message
          ),
          'warning'
        );

        return;

      }


      /*
       * BERHASIL
       */

      if (
        data.recorded
      ) {

        setStatus(
          '✅ KEHADIRAN BERHASIL DICATAT!<br><br>' +
          'Nama: ' +
          escapeHtml(
            data.participant.nama
          ) +
          '<br>' +
          'Hari: ' +
          escapeHtml(
            hari
          ),
          'success'
        );


        tombol.style.display =
          'none';


        return;

      }


      setStatus(
        '⚠️ Respons server tidak dikenali.',
        'warning'
      );

    }

  );

}


/* =====================================================
   SCAN PESERTA BERIKUTNYA
===================================================== */

function scanBerikutnya() {

  sedangMemproses =
    false;


  idPesertaSaatIni =
    '';


  document
    .getElementById(
      'hasilCard'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'decoded'
    )
    .innerHTML =
      '';


  document
    .getElementById(
      'btnKonfirmasi'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'btnKonfirmasi'
    ).disabled =
      false;


  document
    .getElementById(
      'btnKonfirmasi'
    ).textContent =
      '✅ KONFIRMASI KEHADIRAN';


  setStatus(
    '📷 Siap scan peserta berikutnya.',
    'success'
  );

}


/* =====================================================
   JSONP KE APPS SCRIPT
===================================================== */

function panggilAPI(
  action,
  params,
  callback
) {

  const callbackName =
    'callback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      'script'
    );


  const query =
    new URLSearchParams();


  query.set(
    'action',
    action
  );


  query.set(
    'callback',
    callbackName
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      query.set(
        key,
        params[key]
      );

    }
  );


  let selesai =
    false;


  const timeout =
    setTimeout(
      function() {

        if (selesai) {

          return;

        }


        selesai = true;

        cleanup();


        setStatus(
          '❌ Server tidak memberikan respons.',
          'error'
        );


        sedangMemproses =
          false;

      },
      15000
    );


  window[callbackName] =
    function(data) {

      if (selesai) {

        return;

      }


      selesai = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(
        data
      );

    };


  script.src =
    API_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {

      if (selesai) {

        return;

      }


      selesai = true;


      clearTimeout(
        timeout
      );


      cleanup();


      setStatus(
        '❌ Gagal menghubungi Apps Script.',
        'error'
      );


      sedangMemproses =
        false;

    };


  document
    .body
    .appendChild(
      script
    );


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
) {

  return String(
    text || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}

</script>

</body>

</html>
