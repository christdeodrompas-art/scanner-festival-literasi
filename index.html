<body>


<div class="container">


  <div class="header">

    <h1>
      SCANNER KEHADIRAN
    </h1>

    <p>
      Festival Literasi Sulawesi Utara
    </p>

  </div>


  <div class="card">


    <label for="hari">
      Pilih Hari Kehadiran
    </label>


    <select id="hari">

      <option value="Hari 2">
        Hari 2
      </option>

      <option value="Hari 3">
        Hari 3
      </option>

    </select>


    <div id="reader"></div>


    <div
      id="status"
      class="status">
    </div>


    <div
      id="participantBox"
      class="participant">


      <h2>
        DATA PESERTA
      </h2>


      <div class="data-row">

        <div class="data-label">
          Nama Peserta
        </div>

        <div
          class="data-value"
          id="namaPeserta">
          -
        </div>

      </div>


      <div class="data-row">

        <div class="data-label">
          Kabupaten/Kota
        </div>

        <div
          class="data-value"
          id="kabupaten">
          -
        </div>

      </div>


      <div class="data-row">

        <div class="data-label">
          ID Peserta
        </div>

        <div
          class="data-value"
          id="idPeserta">
          -
        </div>

      </div>


      <div class="data-row">

        <div class="data-label">
          Kehadiran
        </div>

        <div
          class="data-value"
          id="hariPeserta">
          -
        </div>

      </div>


      <button
        id="btnConfirm"
        class="btn btn-confirm"
        onclick="konfirmasiKehadiran()">

        ✓ KONFIRMASI KEHADIRAN

      </button>


      <button
        id="btnCancel"
        class="btn btn-cancel"
        onclick="batalScan()">

        BATAL / SCAN ULANG

      </button>


    </div>


  </div>


  <div class="footer">

    Sistem Kehadiran Festival Literasi Sulawesi Utara

  </div>


</div>


<script>


/* =====================================================
   KONFIGURASI API
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwO5fS0KqIH8hUvwWj1ZImgEYsaIeb_fYLkWSbO5q6bD8MuGVlMuAw7kzPMjQH-gNlg/exec";


/* =====================================================
   VARIABEL
===================================================== */

let idPesertaAktif = "";

let sedangMemproses = false;

let requestAktif = null;


/* =====================================================
   STATUS
===================================================== */

function tampilkanStatus(pesan, tipe) {

  const status =
    document.getElementById("status");

  status.className =
    "status " + tipe;

  status.innerHTML =
    pesan;

}


function sembunyikanStatus() {

  const status =
    document.getElementById("status");

  status.className =
    "status";

  status.innerHTML =
    "";

}


/* =====================================================
   TAMPILKAN PESERTA
===================================================== */

function tampilkanPeserta(data) {

  document.getElementById(
    "namaPeserta"
  ).textContent =
    data.nama || "-";


  document.getElementById(
    "kabupaten"
  ).textContent =
    data.kabupaten || "-";


  document.getElementById(
    "idPeserta"
  ).textContent =
    data.idPeserta || "-";


  document.getElementById(
    "hariPeserta"
  ).textContent =
    data.hari || "-";


  document.getElementById(
    "participantBox"
  ).style.display =
    "block";


  document.getElementById(
    "btnConfirm"
  ).style.display =
    "block";


  document.getElementById(
    "btnCancel"
  ).style.display =
    "block";

}


/* =====================================================
   SEMBUNYIKAN PESERTA
===================================================== */

function sembunyikanPeserta() {

  document.getElementById(
    "participantBox"
  ).style.display =
    "none";


  document.getElementById(
    "namaPeserta"
  ).textContent =
    "-";


  document.getElementById(
    "kabupaten"
  ).textContent =
    "-";


  document.getElementById(
    "idPeserta"
  ).textContent =
    "-";


  document.getElementById(
    "hariPeserta"
  ).textContent =
    "-";

}


/* =====================================================
   REQUEST JSONP
===================================================== */

function panggilAPI(parameter, callback) {

  const namaCallback =
    "apiCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  let selesai =
    false;


  window[namaCallback] =
    function(data) {

      if (selesai) {
        return;
      }


      selesai = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(
        null,
        data
      );

    };


  const script =
    document.createElement("script");


  const query =
    Object.keys(parameter)
      .map(function(k) {

        return (
          encodeURIComponent(k) +
          "=" +
          encodeURIComponent(
            parameter[k]
          )
        );

      })
      .join("&");


  script.src =
    API_URL +
    "?" +
    query +
    "&callback=" +
    encodeURIComponent(
      namaCallback
    ) +
    "&_=" +
    Date.now();


  script.async =
    true;


  script.onerror =
    function() {

      if (selesai) {
        return;
      }


      selesai = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(
        new Error(
          "Koneksi ke server gagal."
        ),
        null
      );

    };


  document.body.appendChild(
    script
  );


  const timeout =
    setTimeout(
      function() {

        if (selesai) {
          return;
        }


        selesai = true;


        cleanup();


        callback(

          new Error(
            "Server tidak memberikan respons."
          ),

          null

        );

      },
      15000
    );


  function cleanup() {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }


    try {

      delete window[namaCallback];

    } catch (e) {

      window[namaCallback] =
        undefined;

    }

  }

}


/* =====================================================
   PROSES QR
===================================================== */

function prosesQR(decodedText) {


  if (sedangMemproses) {
    return;
  }


  const idPeserta =
    String(
      decodedText || ""
    ).trim();


  if (!idPeserta) {

    tampilkanStatus(
      "✕ QR tidak berisi ID peserta.",
      "error"
    );


    return;

  }


  sedangMemproses =
    true;


  idPesertaAktif =
    idPeserta;


  const hari =
    document.getElementById(
      "hari"
    ).value;


  tampilkanStatus(

    "⏳ Memeriksa data peserta...",

    "warning"

  );


  panggilAPI(

    {

      action: "lookup",

      id: idPeserta

    },

    function(error, data) {


      sedangMemproses =
        false;


      if (error) {

        console.error(
          error
        );


        tampilkanStatus(

          "✕ Gagal terhubung ke sistem.<br>" +
          "<small>" +
          error.message +
          "</small>",

          "error"

        );


        return;

      }


      if (
        !data
      ) {

        tampilkanStatus(

          "✕ Sistem tidak memberikan respons.",

          "error"

        );


        return;

      }


      if (
        !data.success
      ) {

        tampilkanStatus(

          "✕ " +
          (
            data.message ||
            "Peserta tidak ditemukan."
          ),

          "error"

        );


        return;

      }


      if (
        !data.found
      ) {

        tampilkanStatus(

          "✕ Peserta dengan ID " +
          idPeserta +
          " tidak ditemukan.",

          "error"

        );


        return;

      }


      data.hari =
        hari;


      tampilkanPeserta(
        data
      );


      sembunyikanStatus();

    }

  );

}


/* =====================================================
   KONFIRMASI KEHADIRAN
===================================================== */

function konfirmasiKehadiran() {


  if (
    !idPesertaAktif
  ) {

    tampilkanStatus(

      "✕ ID peserta tidak ditemukan.",

      "error"

    );


    return;

  }


  if (
    requestAktif
  ) {

    return;

  }


  const hari =
    document.getElementById(
      "hari"
    ).value;


  const tombol =
    document.getElementById(
      "btnConfirm"
    );


  tombol.disabled =
    true;


  tombol.textContent =
    "⏳ MENYIMPAN KEHADIRAN...";


  tampilkanStatus(

    "⏳ Menyimpan kehadiran...",

    "warning"

  );


  requestAktif =
    true;


  panggilAPI(

    {

      action: "scan",

      id: idPesertaAktif,

      hari: hari

    },

    function(error, data) {


      requestAktif =
        false;


      if (error) {

        tombol.disabled =
          false;


        tombol.textContent =
          "✓ KONFIRMASI KEHADIRAN";


        tampilkanStatus(

          "✕ Gagal terhubung ke sistem kehadiran.<br>" +
          "<small>" +
          error.message +
          "</small>",

          "error"

        );


        return;

      }


      if (
        !data
      ) {

        tombol.disabled =
          false;


        tombol.textContent =
          "✓ KONFIRMASI KEHADIRAN";


        tampilkanStatus(

          "✕ Sistem tidak memberikan respons.",

          "error"

        );


        return;

      }


      if (
        data.duplicate
      ) {

        tombol.disabled =
          true;


        tombol.textContent =
          "SUDAH HADIR";


        tampilkanStatus(

          "⚠️ PESERTA SUDAH HADIR<br><br>" +

          (
            data.nama ||
            "Peserta"
          ) +

          " sudah tercatat hadir pada " +

          (
            data.hari ||
            hari
          ) +

          ".",

          "warning"

        );


        return;

      }


      if (
        !data.success
      ) {

        tombol.disabled =
          false;


        tombol.textContent =
          "✓ KONFIRMASI KEHADIRAN";


        tampilkanStatus(

          "✕ " +
          (
            data.message ||
            "Kehadiran gagal dicatat."
          ),

          "error"

        );


        return;

      }


      tombol.disabled =
        true;


      tombol.textContent =
        "✓ KEHADIRAN TERCATAT";


      tampilkanStatus(

        "✓ KEHADIRAN BERHASIL DICATAT<br><br>" +

        "<strong>" +
        (
          data.nama ||
          "Peserta"
        ) +
        "</strong><br>" +

        (
          data.hari ||
          hari
        ),

        "success"

      );


      setTimeout(
        function() {

          resetScanner();

        },
        2500
      );

    }

  );

}


/* =====================================================
   BATAL / SCAN ULANG
===================================================== */

function batalScan() {

  resetScanner();

}


/* =====================================================
   RESET
===================================================== */

function resetScanner() {


  idPesertaAktif =
    "";


  sedangMemproses =
    false;


  requestAktif =
    null;


  sembunyikanPeserta();


  sembunyikanStatus();


  const tombol =
    document.getElementById(
      "btnConfirm"
    );


  tombol.disabled =
    false;


  tombol.textContent =
    "✓ KONFIRMASI KEHADIRAN";


  tombol.style.display =
    "block";

}


/* =====================================================
   QR SCANNER
===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  prosesQR(
    decodedText
  );

}


function onScanFailure(
  error
) {

  // Abaikan.
  // Scanner terus mencari QR.

}


/* =====================================================
   JALANKAN SCANNER
===================================================== */

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      rememberLastUsedCamera:
        true

    },

    false

  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>


</body>

</html>
