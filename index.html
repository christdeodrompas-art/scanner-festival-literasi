<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Kehadiran - Festival Literasi Sulawesi Utara 2026</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: auto;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    select {
      border: 1px solid #d1d5db;
      background: white;
      margin-bottom: 12px;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      background: #e0e7ff;
      color: #3730a3;
      font-weight: bold;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    /*
      AREA VIDEO KAMERA
    */

    #cameraContainer {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      min-height: 300px;
    }

    #reader {
      width: 100%;
      min-height: 300px;
    }

    /*
      Biarkan video dari html5-qrcode
      benar-benar terlihat.
    */

    #reader video {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      min-height: 300px !important;
      object-fit: cover !important;
      background: #000 !important;
    }

    /*
      Jangan sembunyikan elemen video.
    */

    #reader__scan_region {
      width: 100% !important;
    }

    /*
      Dashboard bawaan disembunyikan.
    */

    #reader__dashboard {
      display: none !important;
    }

    #reader__camera_selection {
      display: none !important;
    }

    /*
      Overlay kotak scan kita sendiri.
    */

    .scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scan-box {
      width: 65vw;
      max-width: 300px;
      height: 65vw;
      max-height: 300px;
      border: 3px solid #22c55e;
      border-radius: 15px;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.18);
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      z-index: 2;
      background: #111827;
      padding: 30px;
    }

    .camera-placeholder.hidden {
      display: none;
    }

    .camera-placeholder div {
      font-size: 16px;
      line-height: 1.6;
    }

    .scan-info {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      padding-top: 10px;
    }

    .result {
      display: none;
    }

    .result-row {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .result-row strong {
      display: block;
      margin-bottom: 4px;
    }

    .spacer {
      height: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 Scanner Kehadiran</h1>
    <p>Festival Literasi Sulawesi Utara 2026</p>
  </div>


  <div class="card">

    <label for="hari">
      Hari Kehadiran
    </label>

    <select id="hari">

      <option value="Hari 2">
        Hari 2
      </option>

      <option value="Hari 3">
        Hari 3
      </option>

    </select>


    <button
      id="btnKamera"
      onclick="aktifkanKamera()">

      📷 AKTIFKAN KAMERA

    </button>

  </div>


  <div
    id="status"
    class="status">

    Kamera belum diaktifkan.

  </div>


  <div class="card">

    <div id="cameraContainer">

      <div
        id="reader">

      </div>


      <div
        id="placeholder"
        class="camera-placeholder">

        <div>
          📷<br>
          Kamera belum diaktifkan.
        </div>

      </div>


      <div class="scan-overlay">

        <div class="scan-box"></div>

      </div>

    </div>


    <div class="scan-info">

      Arahkan QR peserta ke dalam kotak hijau.

    </div>

  </div>


  <div
    id="resultCard"
    class="card result">

    <h3>📋 Data Peserta</h3>


    <div class="result-row">

      <strong>ID Peserta</strong>

      <span id="hasilId"></span>

    </div>


    <div class="result-row">

      <strong>Nama</strong>

      <span id="hasilNama"></span>

    </div>


    <div class="result-row">

      <strong>Kabupaten/Kota</strong>

      <span id="hasilKabupaten"></span>

    </div>


    <div class="result-row">

      <strong>Instansi/Komunitas</strong>

      <span id="hasilInstansi"></span>

    </div>


    <div class="spacer"></div>


    <button
      id="btnKonfirmasi"
      onclick="konfirmasiKehadiran()">

      ✅ KONFIRMASI KEHADIRAN

    </button>


    <div class="spacer"></div>


    <button
      onclick="scanBerikutnya()">

      🔄 SCAN PESERTA BERIKUTNYA

    </button>

  </div>

</div>


<script>

/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwCdkbSG5DlSZJmM5N8g7KYU4UHuqXXEpXiP70aSr-9XEX9riRQXBUNVyj2nYqQOSPz/exec';


/* =====================================================
   VARIABEL
===================================================== */

let scanner = null;

let kameraAktif = false;

let sedangMemproses = false;

let idPesertaSaatIni = '';

let timerAPI = null;


/* =====================================================
   STATUS
===================================================== */

function setStatus(teks, tipe = '') {

  const el =
    document.getElementById('status');

  el.textContent = teks;

  el.className = 'status';

  if (tipe) {

    el.classList.add(tipe);

  }

}


/* =====================================================
   AKTIFKAN KAMERA
===================================================== */

async function aktifkanKamera() {

  const tombol =
    document.getElementById('btnKamera');

  const placeholder =
    document.getElementById('placeholder');


  if (kameraAktif) {

    return;

  }


  tombol.disabled = true;

  tombol.textContent =
    '⏳ MEMBUKA KAMERA...';


  setStatus(
    '⏳ Meminta akses kamera...'
  );


  try {

    /*
      Bersihkan scanner lama
      jika ada.
    */

    if (scanner) {

      try {

        await scanner.stop();

      } catch (e) {}

      try {

        await scanner.clear();

      } catch (e) {}

      scanner = null;

    }


    /*
      Buat scanner baru.
    */

    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
      KONFIGURASI.

      Tidak menggunakan aspectRatio.
      Tidak menggunakan getCameras().
    */

    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const ukuran =
          Math.floor(
            Math.min(width, height) * 0.65
          );

        return {

          width:
            Math.min(300, ukuran),

          height:
            Math.min(300, ukuran)

        };

      },

      disableFlip: false,

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]

    };


    /*
      LANGSUNG MINTA KAMERA BELAKANG.
    */

    await scanner.start(

      {
        facingMode: {
          ideal: 'environment'
        }
      },

      config,

      function(
        decodedText,
        decodedResult
      ) {

        qrBerhasil(decodedText);

      },

      function(errorMessage) {

        /*
          Tidak perlu menampilkan error
          ketika QR belum terbaca.
        */

      }

    );


    /*
      Kalau sampai di sini,
      START BENAR-BENAR BERHASIL.
    */

    kameraAktif = true;


    /*
      Hilangkan placeholder.
    */

    placeholder.classList.add(
      'hidden'
    );


    tombol.textContent =
      '✅ KAMERA AKTIF';

    tombol.disabled = true;


    setStatus(
      '✅ Kamera aktif. Arahkan QR peserta ke dalam kotak hijau.',
      'success'
    );


    /*
      Pastikan video benar-benar terlihat.
    */

    setTimeout(
      pastikanVideoTerlihat,
      500
    );


  } catch (error) {

    console.error(
      'KAMERA ERROR:',
      error
    );


    kameraAktif = false;


    tombol.disabled = false;

    tombol.textContent =
      '📷 AKTIFKAN KAMERA';


    setStatus(
      '❌ Kamera gagal dibuka: ' +
      (error.message || error),
      'error'
    );


    /*
      Jika gagal,
      bersihkan scanner.
    */

    if (scanner) {

      try {

        await scanner.clear();

      } catch (e) {}

      scanner = null;

    }

  }

}


/* =====================================================
   PASTIKAN VIDEO ADA
===================================================== */

function pastikanVideoTerlihat() {

  const video =
    document.querySelector(
      '#reader video'
    );


  if (!video) {

    console.error(
      'VIDEO TIDAK DITEMUKAN'
    );


    setStatus(
      '❌ Kamera berhasil diminta tetapi video tidak tampil. Silakan refresh halaman dan coba lagi.',
      'error'
    );


    kameraAktif = false;


    const tombol =
      document.getElementById(
        'btnKamera'
      );

    tombol.disabled = false;

    tombol.textContent =
      '📷 AKTIFKAN KAMERA';


    return;

  }


  console.log(
    'VIDEO KAMERA DITEMUKAN',
    video
  );


  video.style.display =
    'block';

  video.style.width =
    '100%';

  video.style.height =
    'auto';

  video.style.objectFit =
    'cover';


  /*
    Pastikan video tidak muted/paused.
  */

  video.setAttribute(
    'playsinline',
    'true'
  );

  video.muted = true;


  if (video.paused) {

    video.play().catch(
      function(error) {

        console.log(
          'Video play:',
          error
        );

      }
    );

  }

}


/* =====================================================
   QR BERHASIL
===================================================== */

function qrBerhasil(
  teksQR
) {

  if (sedangMemproses) {

    return;

  }


  sedangMemproses = true;


  const id =
    ambilIdPeserta(teksQR);


  if (!id) {

    sedangMemproses = false;

    setStatus(
      '❌ QR tidak berisi ID peserta yang valid.',
      'error'
    );

    return;

  }


  idPesertaSaatIni = id;


  setStatus(
    '🔎 QR terbaca. Memeriksa peserta...'
  );


  document.getElementById(
    'resultCard'
  ).style.display = 'block';


  document.getElementById(
    'hasilId'
  ).textContent = id;


  document.getElementById(
    'hasilNama'
  ).textContent =
    'Memuat...';


  document.getElementById(
    'hasilKabupaten'
  ).textContent =
    'Memuat...';


  document.getElementById(
    'hasilInstansi'
  ).textContent =
    'Memuat...';


  panggilAPI(

    'lookup',

    {
      id: id
    },

    function(data) {

      if (
        !data ||
        !data.success ||
        !data.found
      ) {

        sedangMemproses = false;

        idPesertaSaatIni = '';

        setStatus(
          '❌ Peserta tidak ditemukan.',
          'error'
        );

        return;

      }


      document.getElementById(
        'hasilId'
      ).textContent =
        data.id || id;


      document.getElementById(
        'hasilNama'
      ).textContent =
        data.nama || '-';


      document.getElementById(
        'hasilKabupaten'
      ).textContent =
        data.kabupaten || '-';


      document.getElementById(
        'hasilInstansi'
      ).textContent =
        data.instansi || '-';


      setStatus(
        '✅ QR TERBACA: ' +
        (data.id || id),
        'success'
      );


      document.getElementById(
        'btnKonfirmasi'
      ).disabled = false;

    }

  );

}


/* =====================================================
   AMBIL ID PESERTA
===================================================== */

function ambilIdPeserta(
  teks
) {

  if (!teks) {

    return '';

  }


  teks =
    String(teks).trim();


  /*
    QR langsung:
    FLS-20260925-1234
  */

  if (
    /^FLS-/i.test(teks)
  ) {

    return teks;

  }


  /*
    QR berupa URL
  */

  try {

    const url =
      new URL(teks);

    const id =
      url.searchParams.get(
        'id'
      );


    if (
      id &&
      /^FLS-/i.test(id)
    ) {

      return id;

    }

  } catch (e) {}


  /*
    Cari pola FLS
  */

  const cocok =
    teks.match(
      /FLS-\d{8}-\d+/i
    );


  if (cocok) {

    return cocok[0];

  }


  return '';

}


/* =====================================================
   KONFIRMASI KEHADIRAN
===================================================== */

function konfirmasiKehadiran() {

  if (!idPesertaSaatIni) {

    setStatus(
      '❌ ID peserta belum tersedia.',
      'error'
    );

    return;

  }


  const hari =
    document.getElementById(
      'hari'
    ).value;


  const tombol =
    document.getElementById(
      'btnKonfirmasi'
    );


  tombol.disabled = true;

  tombol.textContent =
    '⏳ MENYIMPAN...';


  setStatus(
    '⏳ Menyimpan kehadiran...'
  );


  panggilAPI(

    'scan',

    {
      id:
        idPesertaSaatIni,

      hari:
        hari

    },

    function(data) {

      tombol.disabled = false;

      tombol.textContent =
        '✅ KONFIRMASI KEHADIRAN';


      if (!data) {

        setStatus(
          '❌ Tidak ada respons dari server.',
          'error'
        );

        return;

      }


      if (data.success) {

        setStatus(
          '✅ KEHADIRAN BERHASIL DICATAT - ' +
          hari,
          'success'
        );

        return;

      }


      if (
        data.duplicate ||
        data.already ||
        (
          data.message &&
          data.message
            .toLowerCase()
            .includes('sudah')
        )
      ) {

        setStatus(
          '⚠️ Peserta sudah tercatat untuk ' +
          hari + '.',
          'error'
        );

        return;

      }


      setStatus(
        '❌ ' +
        (
          data.message ||
          'Gagal mencatat kehadiran.'
        ),
        'error'
      );

    }

  );

}


/* =====================================================
   SCAN BERIKUTNYA
===================================================== */

function scanBerikutnya() {

  sedangMemproses = false;

  idPesertaSaatIni = '';


  document.getElementById(
    'resultCard'
  ).style.display = 'none';


  document.getElementById(
    'hasilId'
  ).textContent = '';


  document.getElementById(
    'hasilNama'
  ).textContent = '';


  document.getElementById(
    'hasilKabupaten'
  ).textContent = '';


  document.getElementById(
    'hasilInstansi'
  ).textContent = '';


  document.getElementById(
    'btnKonfirmasi'
  ).disabled = false;


  setStatus(
    '📷 Siap scan peserta berikutnya.',
    'success'
  );

}


/* =====================================================
   API JSONP
===================================================== */

function panggilAPI(
  action,
  params,
  callback
) {

  const callbackName =
    'callback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      'script'
    );


  const query =
    new URLSearchParams();


  query.set(
    'action',
    action
  );


  query.set(
    'callback',
    callbackName
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      query.set(
        key,
        params[key]
      );

    }
  );


  const url =
    API_URL +
    '?' +
    query.toString();


  let selesai = false;


  function bersihkan() {

    if (selesai) {
      return;
    }

    selesai = true;


    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(script);

    }

  }


  window[
    callbackName
  ] = function(data) {

    bersihkan();

    callback(data);

  };


  script.onerror =
    function() {

      bersihkan();


      sedangMemproses =
        false;


      setStatus(
        '❌ Gagal terhubung ke server Apps Script.',
        'error'
      );

    };


  document.body.appendChild(
    script
  );


  timerAPI =
    setTimeout(
      function() {

        if (selesai) {
          return;
        }


        bersihkan();


        sedangMemproses =
          false;


        setStatus(
          '❌ Server terlalu lama merespons.',
          'error'
        );


      },
      15000
    );

}

</script>

</body>
</html>
