<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Festival Literasi Sulawesi Utara 2026</title>

  <!-- QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #0b57d0;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 15px 40px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }

    select {
      border: 1px solid #ccc;
      background: white;
      margin-bottom: 15px;
    }

    button {
      border: none;
      background: #0b57d0;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .camera-card {
      position: relative;
      overflow: hidden;
    }

    #cameraContainer {
      width: 100%;
      min-height: 350px;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #reader {
      width: 100%;
      min-height: 350px;
      background: #111;
      position: relative;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      min-height: 350px;
      object-fit: cover !important;
      display: block !important;
      background: #111;
    }

    #reader img {
      display: none !important;
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      background: #111;
      z-index: 5;
      text-align: center;
      padding: 20px;
    }

    #placeholder .camera-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    #placeholder p {
      margin: 5px 0;
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scan-box {
      width: 65%;
      max-width: 300px;
      aspect-ratio: 1 / 1;
      border: 4px solid #00ff66;
      border-radius: 15px;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.35),
        0 0 15px rgba(0,255,102,0.8);
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 9px;
      background: #eef2f5;
      font-size: 14px;
      text-align: center;
    }

    .status.success {
      background: #dff6e5;
      color: #146c2e;
    }

    .status.error {
      background: #ffe1e1;
      color: #a30000;
    }

    .status.warning {
      background: #fff3cd;
      color: #856404;
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
    }

    .participant-info {
      background: #f7f9fb;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .participant-info div {
      margin-bottom: 8px;
    }

    .participant-info div:last-child {
      margin-bottom: 0;
    }

    .participant-info strong {
      display: inline-block;
      min-width: 125px;
    }

    .success-box {
      background: #dff6e5;
      color: #146c2e;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .duplicate-box {
      background: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .id-peserta {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
      color: #0b57d0;
    }

    .small {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 15px;
    }

    @media (max-width: 500px) {
      .container {
        margin-top: 10px;
      }

      .card {
        padding: 15px;
      }

      #cameraContainer,
      #reader {
        min-height: 300px;
      }

      #reader video {
        min-height: 300px;
      }

      .scan-box {
        width: 70%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Festival Literasi Sulawesi Utara 2026</h1>
    <p>Scanner Kehadiran Peserta</p>
  </div>

  <div class="container">

    <!-- PILIH HARI -->
    <div class="card">

      <label for="hari">
        Pilih Hari Kehadiran
      </label>

      <select id="hari">
        <option value="Hari 2">Hari 2</option>
        <option value="Hari 3">Hari 3</option>
      </select>

      <button id="btnKamera" onclick="aktifkanKamera()">
        📷 AKTIFKAN KAMERA
      </button>

      <div id="status" class="status">
        Kamera belum diaktifkan.
      </div>

    </div>


    <!-- CAMERA -->
    <div class="card camera-card">

      <div id="cameraContainer">

        <div id="reader"></div>

        <div id="placeholder">
          <div class="camera-icon">📷</div>
          <p><strong>Kamera belum aktif</strong></p>
          <p>Tekan tombol "AKTIFKAN KAMERA"</p>
        </div>

        <div class="scan-overlay">
          <div class="scan-box"></div>
        </div>

      </div>

      <div class="small">
        Arahkan QR peserta ke dalam kotak hijau.
      </div>

    </div>


    <!-- HASIL SCAN -->
    <div id="resultCard" class="card result">

      <h3 style="margin-top:0;">
        Data Peserta
      </h3>

      <div id="hasilScan"></div>

      <button id="btnKonfirmasi" onclick="konfirmasiKehadiran()">
        ✅ KONFIRMASI KEHADIRAN
      </button>

      <button
        onclick="scanLagi()"
        style="margin-top:10px;background:#555;">
        🔄 SCAN LAGI
      </button>

    </div>


    <!-- HASIL KEHADIRAN -->
    <div id="successCard" class="card result">

      <div id="hasilKehadiran"></div>

      <button onclick="scanLagi()">
        🔄 SCAN PESERTA BERIKUTNYA
      </button>

    </div>

  </div>


<script>

  /* =====================================================
     KONFIGURASI
  ===================================================== */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbwCdkbSG5DlSZJmM5N8g7KYU4UHuqXXEpXiP70aSr-9XEX9riRQXBUNVyj2nYqQOSPz/exec';


  /* =====================================================
     VARIABEL
  ===================================================== */

  let scanner = null;
  let kameraAktif = false;
  let sedangMemproses = false;
  let pesertaTerpilih = null;


  /* =====================================================
     AKTIFKAN KAMERA
  ===================================================== */

  async function aktifkanKamera() {

    const btn = document.getElementById('btnKamera');
    const status = document.getElementById('status');
    const placeholder = document.getElementById('placeholder');

    if (kameraAktif) {

      status.className = 'status success';
      status.textContent = '✅ Kamera sudah aktif. Arahkan QR ke kotak hijau.';

      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ MEMBUKA KAMERA...';

    status.className = 'status warning';
    status.textContent = '⏳ Sedang membuka kamera...';

    try {

      if (scanner) {

        try {
          await scanner.stop();
        } catch (e) {}

        try {
          await scanner.clear();
        } catch (e) {}

        scanner = null;
      }


      scanner = new Html5Qrcode('reader');


      const config = {

        fps: 10,

        qrbox: function(width, height) {

          const ukuran =
            Math.floor(Math.min(width, height) * 0.65);

          return {
            width: Math.min(300, ukuran),
            height: Math.min(300, ukuran)
          };

        },

        disableFlip: false,

        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ]

      };


      /* =================================================
         PENTING:
         facingMode menggunakan STRING
         agar kompatibel dengan html5-qrcode
      ================================================= */

      await scanner.start(

        'environment',

        config,

        function(decodedText, decodedResult) {

          qrBerhasil(decodedText);

        },

        function(errorMessage) {

          // Error scanning biasa diabaikan.
          // Kamera tetap berjalan.

        }

      );


      kameraAktif = true;

      placeholder.classList.add('hidden');

      btn.disabled = false;
      btn.textContent = '📷 KAMERA AKTIF';

      status.className = 'status success';
      status.textContent =
        '✅ Kamera aktif. Arahkan QR peserta ke kotak hijau.';


      pastikanVideoTerlihat();


    } catch (error) {

      console.error(error);

      kameraAktif = false;

      btn.disabled = false;
      btn.textContent = '📷 AKTIFKAN KAMERA';

      status.className = 'status error';

      status.textContent =
        '❌ Kamera gagal dibuka: ' +
        (error.message || error);

    }

  }


  /* =====================================================
     PASTIKAN VIDEO TERLIHAT
  ===================================================== */

  function pastikanVideoTerlihat() {

    setTimeout(function() {

      const video =
        document.querySelector('#reader video');

      if (video) {

        video.style.display = 'block';
        video.style.width = '100%';
        video.style.height = 'auto';
        video.style.minHeight = '300px';
        video.style.objectFit = 'cover';

        try {
          video.play();
        } catch (e) {}

      }

    }, 1000);

  }


  /* =====================================================
     QR BERHASIL TERBACA
  ===================================================== */

  function qrBerhasil(decodedText) {

    if (sedangMemproses) {
      return;
    }

    sedangMemproses = true;


    let idPeserta =
      String(decodedText || '').trim();


    /*
      QR seharusnya hanya berisi ID peserta,
      contoh:
      FLS-20260925-7169
    */


    if (!idPeserta) {

      sedangMemproses = false;

      return;

    }


    const status =
      document.getElementById('status');

    status.className = 'status warning';

    status.textContent =
      '⏳ QR terbaca: ' + idPeserta +
      '. Mencari data peserta...';


    cariPeserta(idPeserta);

  }


  /* =====================================================
     CARI PESERTA KE APPS SCRIPT
  ===================================================== */

  function cariPeserta(idPeserta) {

    const callbackName =
      'lookupCallback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 10000);


    const script =
      document.createElement('script');


    window[callbackName] = function(data) {

      try {

        if (!data || !data.success) {

          tampilkanError(
            data && data.message
              ? data.message
              : 'Data peserta tidak ditemukan.'
          );

          return;
        }


        if (!data.found) {

          tampilkanError(
            'ID peserta tidak ditemukan: ' +
            idPeserta
          );

          return;
        }


        pesertaTerpilih = data;


        tampilkanPeserta(data);


      } finally {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }

    };


    script.onerror = function() {

      tampilkanError(
        'Tidak dapat terhubung ke server.'
      );

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


    script.src =
      API_URL +
      '?action=lookup' +
      '&id=' +
      encodeURIComponent(idPeserta) +
      '&callback=' +
      encodeURIComponent(callbackName);


    document.body.appendChild(script);

  }


  /* =====================================================
     TAMPILKAN DATA PESERTA
  ===================================================== */

  function tampilkanPeserta(data) {

    const resultCard =
      document.getElementById('resultCard');

    const hasil =
      document.getElementById('hasilScan');

    const status =
      document.getElementById('status');


    hasil.innerHTML =

      '<div class="participant-info">' +

      '<div>' +
      '<strong>ID Peserta</strong>: ' +
      escapeHtml(data.idPeserta || '') +
      '</div>' +

      '<div>' +
      '<strong>Nama</strong>: ' +
      escapeHtml(data.nama || '') +
      '</div>' +

      '<div>' +
      '<strong>Kabupaten/Kota</strong>: ' +
      escapeHtml(data.kabupaten || '') +
      '</div>' +

      '<div>' +
      '<strong>Instansi</strong>: ' +
      escapeHtml(data.instansi || '') +
      '</div>' +

      '<div>' +
      '<strong>Jenis Peserta</strong>: ' +
      escapeHtml(data.jenisPeserta || '') +
      '</div>' +

      '</div>';


    resultCard.classList.add('show');


    status.className = 'status success';

    status.textContent =
      '✅ QR TERBACA: ' +
      (data.idPeserta || '');


    sedangMemproses = false;

  }


  /* =====================================================
     KONFIRMASI KEHADIRAN
  ===================================================== */

  function konfirmasiKehadiran() {

    if (!pesertaTerpilih) {

      tampilkanError(
        'Data peserta belum tersedia.'
      );

      return;

    }


    const hari =
      document.getElementById('hari').value;


    const btn =
      document.getElementById('btnKonfirmasi');


    btn.disabled = true;
    btn.textContent =
      '⏳ MENYIMPAN KEHADIRAN...';


    const status =
      document.getElementById('status');


    status.className = 'status warning';

    status.textContent =
      '⏳ Menyimpan kehadiran...';


    const callbackName =
      'scanCallback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 10000);


    const script =
      document.createElement('script');


    window[callbackName] = function(data) {

      try {

        if (!data) {

          tampilkanError(
            'Respons server kosong.'
          );

          return;
        }


        if (data.success) {

          tampilkanBerhasil(data);

        } else {

          /*
            Jika peserta sudah hadir,
            tampilkan sebagai duplikat.
          */

          if (
            data.duplicate ||
            data.status === 'SUDAH HADIR'
          ) {

            tampilkanDuplikat(data);

          } else {

            tampilkanError(
              data.message ||
              'Kehadiran gagal disimpan.'
            );

          }

        }

      } finally {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        btn.disabled = false;

        btn.textContent =
          '✅ KONFIRMASI KEHADIRAN';

      }

    };


    script.onerror = function() {

      tampilkanError(
        'Tidak dapat menghubungi server.'
      );

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      btn.disabled = false;

      btn.textContent =
        '✅ KONFIRMASI KEHADIRAN';

    };


    script.src =
      API_URL +
      '?action=scan' +
      '&id=' +
      encodeURIComponent(
        pesertaTerpilih.idPeserta
      ) +
      '&hari=' +
      encodeURIComponent(hari) +
      '&callback=' +
      encodeURIComponent(callbackName);


    document.body.appendChild(script);

  }


  /* =====================================================
     BERHASIL
  ===================================================== */

  function tampilkanBerhasil(data) {

    document
      .getElementById('resultCard')
      .classList.remove('show');


    const successCard =
      document.getElementById('successCard');


    const hasil =
      document.getElementById('hasilKehadiran');


    hasil.innerHTML =

      '<div class="success-box">' +

      '✅ KEHADIRAN BERHASIL DICATAT' +

      '</div>' +

      '<div class="participant-info">' +

      '<div>' +
      '<strong>Nama</strong>: ' +
      escapeHtml(
        pesertaTerpilih.nama || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>ID Peserta</strong>: ' +
      escapeHtml(
        pesertaTerpilih.idPeserta || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>Hari</strong>: ' +
      escapeHtml(
        document.getElementById('hari').value
      ) +
      '</div>' +

      '</div>';


    successCard.classList.add('show');


    const status =
      document.getElementById('status');


    status.className =
      'status success';


    status.textContent =
      '✅ Kehadiran berhasil dicatat.';


    pesertaTerpilih = null;

  }


  /* =====================================================
     DUPLIKAT
  ===================================================== */

  function tampilkanDuplikat(data) {

    document
      .getElementById('resultCard')
      .classList.remove('show');


    const successCard =
      document.getElementById('successCard');


    const hasil =
      document.getElementById('hasilKehadiran');


    hasil.innerHTML =

      '<div class="duplicate-box">' +

      '⚠️ PESERTA SUDAH HADIR PADA HARI INI' +

      '</div>' +

      '<div class="participant-info">' +

      '<div>' +
      '<strong>Nama</strong>: ' +
      escapeHtml(
        pesertaTerpilih.nama || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>ID Peserta</strong>: ' +
      escapeHtml(
        pesertaTerpilih.idPeserta || ''
      ) +
      '</div>' +

      '<div>' +
      '<strong>Hari</strong>: ' +
      escapeHtml(
        document.getElementById('hari').value
      ) +
      '</div>' +

      '</div>';


    successCard.classList.add('show');


    const status =
      document.getElementById('status');


    status.className =
      'status warning';


    status.textContent =
      '⚠️ Peserta sudah tercatat hadir hari ini.';


    pesertaTerpilih = null;

  }


  /* =====================================================
     ERROR
  ===================================================== */

  function tampilkanError(message) {

    document
      .getElementById('resultCard')
      .classList.remove('show');


    document
      .getElementById('successCard')
      .classList.remove('show');


    const status =
      document.getElementById('status');


    status.className =
      'status error';


    status.textContent =
      '❌ ' + message;


    sedangMemproses = false;

  }


  /* =====================================================
     SCAN LAGI
  ===================================================== */

  function scanLagi() {

    pesertaTerpilih = null;

    sedangMemproses = false;


    document
      .getElementById('resultCard')
      .classList.remove('show');


    document
      .getElementById('successCard')
      .classList.remove('show');


    const status =
      document.getElementById('status');


    if (kameraAktif) {

      status.className =
        'status success';

      status.textContent =
        '✅ Kamera aktif. Arahkan QR berikutnya.';

    } else {

      status.className =
        'status';

      status.textContent =
        'Kamera belum diaktifkan.';

    }

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(value) {

    return String(value || '')

      .replace(/&/g, '&amp;')

      .replace(/</g, '&lt;')

      .replace(/>/g, '&gt;')

      .replace(/"/g, '&quot;')

      .replace(/'/g, '&#039;');

  }


  /* =====================================================
     SAAT HALAMAN DIBUKA
  ===================================================== */

  window.addEventListener('load', function() {

    const status =
      document.getElementById('status');

    status.className =
      'status';

    status.textContent =
      'Kamera belum diaktifkan. Tekan tombol untuk memulai.';

  });

</script>

</body>
</html>
